---
name: Initiative Component Project
description: Reference to a component project repository 
title: "[Theme]: Edit title after colon"
labels:
  - cprepo
  - cp-init
  - triage
projects:
  - Case-Sensitive-Org/0
assignees:
  - OneOrMoreGitHubUsers
body:
  - type: markdown
    id: cprepo_head_title
    attributes:
      value: "# Component Project Repository"

  - type: markdown
    id: cprepo_head_description
    attributes:
      value: |
        Each Component Project Repository for this Initiative is tracked as an
        individual Issue.

        This enables Issues for the Component Projects in this Initiative to be referenced
        in the GitHub project and reference infrastructure (autolinks, inclusion in Project
        tools, and so on).

  - type: markdown
    id: cprepo_linking_title
    attributes:
      value: "## Repo Linking"

  - type: markdown
    id: cprepo_linking_description
    attributes:
      value: |
        Link an individual Component Project Repository to this Initiative
        use the same structure as is used for Issue Linking throughout.

        Tags and Linked Repositories
        - :cprepo --> a Component Project Repository URL
        
        Do not delete a cprepo reference, mark as merge or split and **Closed as Not Planned**.

  - type: textarea
    id: linking
    attributes:
      label: Linked Repository
      description: "Tag Repository URL with :cprepo"
      placeholder: |
        - :cprepo repository url

    validations:
      required: true

  - type: markdown
    id: cprepo_summary_title
    attributes:
      value: "## Rolling Summary"

  - type: markdown
    id: cprepo_summary_description
    attributes:
      value: |
        Capture discussion ongoing on this Component Project Repo (as a reference to same).

  - type: textarea
    id: summary
    attributes:
      label: Rolling Summary
      description: Pull discussion conclusions and update over time…
      placeholder: |
        Anything that appears in ongoing discussion rolled up into this summary text.

    validations:
      required: false

  - type: markdown
    id: cprepo_helpful_title
    attributes: 
      value: "## Helpful Issue-filing Links"

  - type: markdown
    id: cprepo_helpful_description
    attributes: 
      value: |
        - [Linking to Issues and PRs across Repositories](https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/autolinked-references-and-urls#issues-and-pull-requests)
